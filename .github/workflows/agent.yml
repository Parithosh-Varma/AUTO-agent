# Bounded agent cycles. Each run is capped; state persists via --sync to D1
# when DASHBOARD_API_URL + DASHBOARD_TOKEN secrets are configured, otherwise
# the export.json artifact is the portable snapshot (runner FS is temporary).
name: agent

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Bounded cycles for this run"
        required: false
        default: "25"

concurrency:
  group: auto-agent
  cancel-in-progress: false

jobs:
  cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Bounded agent cycles
        env:
          CYCLE_SLEEP_SECONDS: "0"
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          # Non-secret allowlist — safe as an Actions *variable*:
          AGENT_ALLOWED_REPOS: ${{ vars.AGENT_ALLOWED_REPOS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: "https://integrate.api.nvidia.com/v1"
          LLM_MODEL: "meta/muse-glimmer-30b"
        run: |
          python3 main.py --cycles "${{ inputs.cycles || '25' }}"
          python3 main.py --sync || true
          python3 main.py --export || true
      - name: Upload export snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-${{ github.run_number }}
          path: data/export.json
          if-no-files-found: warn

  # Production deploy (Worker API + D1 migrations + Pages frontend).
  # Runs only with manual approval via the `production` environment, and only
  # when the Cloudflare secrets below exist. Secrets are never logged.
  # Required repo secrets (Settings → Secrets and variables → Actions):
  #   CLOUDFLARE_API_TOKEN   (Workers/D1/Pages edit + Account read)
  #   CLOUDFLARE_ACCOUNT_ID  (32-hex account ID)
  #   CLOUDFLARE_DATABASE_ID (from one-time `wrangler d1 create auto_memory`)
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    needs: cycles
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Install wrangler
        run: npm i -g wrangler
      - name: Render wrangler.toml (database ID injected, never logged)
        env:
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          python3 -c "
          import os
          dbid = os.environ.get('CLOUDFLARE_DATABASE_ID', '').strip()
          assert dbid, 'CLOUDFLARE_DATABASE_ID secret is empty'
          tpl = open('cloudflare/wrangler.toml.example').read()
          assert 'REPLACE_ME' in tpl, 'template marker missing'
          open('cloudflare/wrangler.toml', 'w').write(tpl.replace('REPLACE_ME', dbid))
          print('wrangler.toml rendered')
          "
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply auto_memory --remote --config cloudflare/wrangler.toml
      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config cloudflare/wrangler.toml
      - name: Deploy Pages frontend
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: auto-agent-dashboard
          directory: dashboard/
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
